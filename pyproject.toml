[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remocon"
dynamic = ["version"]
description = "One web remote control for Claude Code and Codex sessions on every machine you own."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# The hub and agents are pure standard library; Windows needs a ConPTY binding
# to drive claude's terminal.
dependencies = ["pywinpty>=2.0; sys_platform == 'win32'"]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
winservice = ["pywin32>=306; sys_platform == 'win32'"]
dev = ["pytest>=8"]

[project.scripts]
remocon = "remocon.cli:main"

[tool.setuptools.dynamic]
version = { attr = "remocon.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
remocon = ["web/*.html", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
